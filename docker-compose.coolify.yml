services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${SERVICE_FQDN_NGINX:-http://localhost}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${SERVICE_FQDN_NGINX:-http://localhost}
    depends_on:
      - backend
    networks:
      - vehicle-booking-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-vehicle_user}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-vehicle_booking}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USERNAME: ${EMAIL_USERNAME:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      LINE_NOTIFY_TOKEN: ${LINE_NOTIFY_TOKEN:-}
    depends_on:
      - db
      - redis
    networks:
      - vehicle-booking-network

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vehicle_booking}
      MYSQL_USER: ${MYSQL_USER:-vehicle_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - vehicle-booking-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - vehicle-booking-network

  nginx:
    build:
      context: ./nginx
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - frontend
      - backend
    networks:
      - vehicle-booking-network

volumes:
  db_data:
  redis_data:

networks:
  vehicle-booking-network:
    driver: bridge
